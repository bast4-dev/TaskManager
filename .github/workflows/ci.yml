name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - install & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installer les dépendances
        run: npm install --no-fund
      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high || true

  frontend:
    name: Frontend - build & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm install --no-fund
      - name: Construire le build de production
        run: npm run build
        env:
          CI: false
      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high || true

  docker:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -t taskmanager-backend ./backend
      - name: Build image frontend
        run: docker build -t taskmanager-frontend ./frontend
